name: watch carrot-wip

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs can start late or be skipped under load
  workflow_dispatch:
    inputs:
      base_sha:
        description: "테스트 발송: 이 커밋부터 지금까지를 보낸다 (기록은 안 바꿈)"
        required: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check and notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: python watch.py
      - name: save last seen commit
        run: |
          if [ -n "$(git status --porcelain last_sha.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_sha.txt
            git commit -m "state: $(cut -c1-9 last_sha.txt)"
            git push
          fi
