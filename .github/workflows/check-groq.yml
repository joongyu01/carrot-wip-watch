name: verify Groq connection
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import watch; result = watch.groq_summary('연결 확인용입니다. 한국어로 연결 성공이라고만 답하세요.'); print(result); assert not result.startswith('(AI 요약 실패:')"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
